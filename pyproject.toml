[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spare-parts-demand-forecaster"
version = "0.1.0"
description = "MVP for forecasting spare parts demand and generating replenishment recommendations for repair workshops."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Jonathan Salgado Nieto" }
]
keywords = [
  "forecasting",
  "inventory",
  "spare-parts",
  "streamlit",
  "machine-learning",
  "xgboost",
  "lightgbm",
  "catboost"
]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "xgboost>=2.1",
  "lightgbm>=4.5",
  "catboost>=1.2",
  "streamlit>=1.38",
  "plotly>=5.24",
  "sqlalchemy>=2.0",
  "pydantic>=2.8",
  "python-dotenv>=1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "black>=24.8",
  "ipykernel>=6.29"
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP"
]
ignore = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"